<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYR Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 20px; border: 2px solid #f1c40f;
            width: 90%; max-width: 500px; text-align: center; position: relative;
        }
        .logo-img { width: 100%; max-width: 200px; border-radius: 15px; margin-bottom: 20px; }
        .btn { padding: 15px 40px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; font-weight: 600; border: none; transition: 0.3s; margin-top: 10px; }
        .btn-apply { background: #00bfff; color: white; }
        .btn-submit { background: #f1c40f; color: black; width: 100%; }
        .btn:disabled { background: #555 !important; cursor: not-allowed; opacity: 0.6; }

        #form-page, #result-page { display: none; text-align: left; }
        
        .form-card {
            background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 10px;
            margin-bottom: 15px; border-left: 5px solid #f1c40f;
        }
        label { color: #f1c40f; display: block; margin-bottom: 5px; font-size: 0.9rem; }
        input, select, textarea {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.3);
            border: 1px solid #444; border-radius: 5px; color: white; box-sizing: border-box;
        }

        /* แถบเวลาปิดรับสมัครด้านล่าง */
        .deadline-footer {
            margin-top: 20px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.85rem; color: #ffbc00; font-weight: 400;
        }
        .closed-text { color: #ff4757; font-weight: 600; font-size: 1.2rem; display: none; }

        .result-box {
            background: rgba(255, 255, 255, 0.15); padding: 20px; border-radius: 15px;
            border: 2px dashed #f1c40f; margin: 20px 0;
        }
        .highlight-text {
            color: #ff4757; font-size: 1.5rem; font-weight: 600; text-align: center; margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container animate__animated animate__fadeIn">
    
    <div id="main-page" class="animate__animated animate__zoomIn">
        <img src="hyr-logo.png" alt="Logo" class="logo-img animate__animated animate__pulse animate__infinite">
        <h2 style="color:#f1c40f">HAT YAI RAILWAYS</h2>
        <p>เปิดรับสมัครพนักงาน</p>
        <button id="start-btn" class="btn btn-apply" onclick="goToForm()">เริ่มการสมัคร</button>
        <div id="main-closed-msg" class="closed-text animate__animated animate__shakeX">ขณะนี้ปิดรับสมัครแล้ว</div>
    </div>

    <div id="form-page">
        <h2 style="text-align:center; color:#f1c40f">แบบฟอร์มสมัครงาน</h2>
        <form id="appForm">
            <div class="form-card"><label>👤 ชื่อ-นามสกุล</label><input type="text" id="in-name" required></div>
            <div class="form-card"><label>🎮 ชื่อดิสคอร์ด</label><input type="text" id="in-discord" required></div>
            <div class="form-card">
                <label>🚉 ตำแหน่งที่สมัคร</label>
                <select id="in-pos" required>
                    <option value="">-- เลือกตำแหน่ง --</option>
                    <option>พนักงานขับรถไฟ</option> 
                    <option>นายสถานี</option>
                    <option>พนักงานขายตั๋ว</option>
                    <option>พนักงานคุมประแจ</option>
                    <option>พนักงานไม้กั้น</option>
                    <option>พนักงานรักษารถ</option>
                    <option>พนักงานห้ามล้อ</option>
                </select>
            </div>
            <div class="form-card"><label>📝 เหตุผลที่อยากสมัคร</label><textarea id="in-reason" rows="3" required></textarea></div>
            <button type="submit" id="submit-btn" class="btn btn-submit">ยืนยันข้อมูล</button>
            <div id="form-closed-msg" class="closed-text" style="text-align:center; margin-top:10px;">หมดเวลาส่งใบสมัครแล้ว</div>
        </form>
    </div>

    <div id="result-page">
        <div class="highlight-text animate__animated animate__flash animate__infinite">
            ⚠️ กรุณาแคปรูปหน้านี้ส่ง DM
        </div>
        <div class="result-box">
            <h3 style="text-align:center; margin-top:0; color:#f1c40f;">ใบสรุปการสมัคร</h3>
            <div id="res-content">
                <p>ชื่อ: <span id="res-name"></span></p>
                <p>ดิสคอร์ด: <span id="res-discord"></span></p>
                <p>ตำแหน่ง: <span id="res-pos"></span></p>
            </div>
        </div>
        <button class="btn btn-apply" style="width:100%;" onclick="location.reload()">กลับหน้าหลัก</button>
    </div>

    <div class="deadline-footer" id="footer-timer">
        ⏳ ปิดรับสมัครวันที่: 14 พฤษภาคม 2026 เวลา 07:30 น.
    </div>
</div>

<script>
    // ตั้งค่าเวลาปิดรับสมัคร: 14 พฤษภาคม 2026 เวลา 07:30:00
    const closeDate = new Date("May 14, 2026 07:30:00").getTime();

    function checkDeadline() {
        const now = new Date().getTime();
        if (now > closeDate) {
            // ถ้าเลยเวลาแล้ว
            const startBtn = document.getElementById('start-btn');
            const submitBtn = document.getElementById('submit-btn');
            
            if(startBtn) startBtn.disabled = true;
            if(submitBtn) submitBtn.disabled = true;
            
            document.getElementById('main-closed-msg').style.display = 'block';
            document.getElementById('form-closed-msg').style.display = 'block';
            document.getElementById('footer-timer').innerHTML = "❌ ปิดรับสมัครเรียบร้อยแล้ว";
            document.getElementById('footer-timer').style.color = "#ff4757";
            return true; // ปิดแล้ว
        }
        return false; // ยังเปิดอยู่
    }

    // ตรวจสอบทันทีที่เปิดหน้าเว็บ
    setInterval(checkDeadline, 1000);

    function goToForm() {
        if (checkDeadline()) return; // ถ้าปิดแล้วไม่ให้ไปต่อ
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('form-page').style.display = 'block';
    }

    document.getElementById('appForm').onsubmit = function(e) {
        e.preventDefault();
        if (checkDeadline()) {
            alert("ขออภัย หมดเวลาส่งใบสมัครแล้ว");
            return;
        }
        
        document.getElementById('res-name').innerText = document.getElementById('in-name').value;
        document.getElementById('res-discord').innerText = document.getElementById('in-discord').value;
        document.getElementById('res-pos').innerText = document.getElementById('in-pos').value;

        document.getElementById('form-page').style.display = 'none';
        document.getElementById('result-page').style.display = 'block';
    };
</script>

</body>
</html>
